name: release

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  # Builds the release artifacts and emits their sha256 digests for the
  # provenance job below.
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              libssl-dev libftdi1-dev libusb-1.0-0-dev

      # libinfnoise is not packaged upstream; same source build the other
      # workflows use.
      - name: Build and install libinfnoise (waywardgeek upstream)
        run: |
          git clone --depth 1 https://github.com/waywardgeek/infnoise /tmp/infnoise
          cd /tmp/infnoise/software
          make -f Makefile.linux libinfnoise.a libinfnoise.so
          sudo install -D -m 644 libinfnoise.h  /usr/local/include/libinfnoise.h
          sudo install -D -m 755 libinfnoise.so /usr/local/lib/libinfnoise.so
          sudo ldconfig

      - name: Build provider and SBOM
        run: |
          export CPATH=/usr/local/include
          export LIBRARY_PATH=/usr/local/lib
          make
          make sbom

      # git archive derives the tarball mtimes from the tagged commit, so the
      # same tag produces the same bytes.
      - name: Create source tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz \
              --prefix="infnoise-provider-${version}/" \
              -o "infnoise-provider-${version}.tar.gz" "$TAG"

      - name: Generate subject digests
        id: hash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "hashes=$(sha256sum \
              infnoise.so \
              sbom.spdx.txt \
              "infnoise-provider-${version}.tar.gz" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            infnoise.so
            sbom.spdx.txt
            infnoise-provider-*.tar.gz
          if-no-files-found: error
          retention-days: 5

  # SLSA Build L3 provenance. The generator MUST be referenced by a full
  # vX.Y.Z tag: it verifies its own provenance and fails on a commit SHA or a
  # shortened tag, so do not "fix" this to match the SHA pinning elsewhere.
  # https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md
  provenance:
    needs: [build]
    permissions:
      actions: read       # read the workflow path for the provenance subject
      id-token: write     # sign the provenance via Sigstore
      contents: write     # attach it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" \
              infnoise.so \
              sbom.spdx.txt \
              infnoise-provider-*.tar.gz \
              --clobber
